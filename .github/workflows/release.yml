name: Release

on:
  push:
    branches:
      - production

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get date-based version
        id: version
        run: |
          date="$(date -u +'%Y.%m.%d')"
          last=$(git tag -l "v${date}-*" | sed "s/^v${date}-//" | sort -n | tail -1)
          next=$([ -z "$last" ] && echo 0 || echo $((last + 1)))
          echo "tag=v${date}-${next}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
