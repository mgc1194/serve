name: Release

on:
  push:
    branches:
      - production

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag and release any untagged production commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # GitHub's concurrency group only keeps one pending run, so a burst of
          # pushes can drop a run entirely. Find the most recently tagged commit
          # on production's first-parent history and process everything after
          # it (falling back to this push's own delta if nothing is tagged yet),
          # so a later run always catches up whatever an earlier run missed.
          boundary=""
          for commit in $(git rev-list --first-parent HEAD); do
            if [ -n "$(git tag --points-at "$commit" -l 'v*.*.*-*')" ]; then
              boundary="$commit"
              break
            fi
          done

          if [ -z "$boundary" ] && [ -n "$BEFORE_SHA" ] \
              && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            boundary="$BEFORE_SHA"
          fi

          if [ -n "$boundary" ]; then
            commits=$(git rev-list --first-parent --reverse "${boundary}..HEAD")
          else
            commits=$(git rev-parse HEAD)
          fi

          for commit in $commits; do
            if [ -n "$(git tag --points-at "$commit" -l 'v*.*.*-*')" ]; then
              continue
            fi

            date="$(date -u +'%Y.%m.%d')"
            last=$(git tag -l "v${date}-*" | sed "s/^v${date}-//" | sort -n | tail -1)
            next=$([ -z "$last" ] && echo 0 || echo $((last + 1)))
            tag="v${date}-${next}"

            git tag "$tag" "$commit"
            git push origin "$tag"
            gh release create "$tag" --target "$commit" --title "Release ${tag}" --generate-notes
          done
