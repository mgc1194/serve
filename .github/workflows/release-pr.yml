name: Open Release PR

on:
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create or reuse PR from main to production
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AHEAD=$(git rev-list --count origin/production..origin/main)
          if [ "$AHEAD" -eq 0 ]; then
            echo "production is already up to date with main. Nothing to release."
            exit 0
          fi

          PR_URL=$(gh pr list --base production --head main --json url --jq '.[0].url')
          if [ -n "$PR_URL" ]; then
            echo "Existing PR: $PR_URL"
          else
            TITLE="Release: $(date -u +'%Y-%m-%d') (main -> production)"
            PR_URL=$(gh pr create --base production --head main --title "$TITLE" --body "Automated release PR: merges \`main\` into \`production\`.")
            echo "Created PR: $PR_URL"
          fi
