name: Tests

on:
  pull_request:
    branches: [ "**" ]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    # Matches production's MySQL major version (Railway runs mysql:9) rather
    # than relying on the runner's preinstalled MySQL, which lagged behind
    # at 8.0.x and doesn't meet Django 6.1's MySQL 8.4+ requirement.
    services:
      mysql:
        image: mysql:9
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: serve
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Run tests
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DJANGO_SECRET_KEY: test-secret-key-for-ci
          DJANGO_DEBUG: "False"
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: serve
          DB_USER: root
          DB_PASSWORD: ""
        run: pytest -v

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: frontend
        run: pnpm tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Run tests
        working-directory: frontend
        run: pnpm test --run
        